name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rails and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: gift_card_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gift_card_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:local-ci-only-password@127.0.0.1:5432/gift_card_api_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare PostgreSQL test database
        run: bin/rails db:prepare
      - name: Run RSpec
        run: bundle exec rspec
      - name: Check Ruby style
        run: bin/rubocop
      - name: Run Brakeman
        run: bin/brakeman --no-pager
      - name: Audit gems
        run: bin/bundler-audit check --update
